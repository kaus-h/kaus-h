name: refresh profile telemetry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/profile.json"
      - "scripts/generate_profile.py"
      - ".github/workflows/profile-metrics.yml"
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: fetch public github signal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "kaus-h-profile-telemetry",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          user = get_json("https://api.github.com/users/kaus-h")
          repos = get_json("https://api.github.com/users/kaus-h/repos?per_page=100&sort=updated")
          events = get_json("https://api.github.com/users/kaus-h/events/public?per_page=100")

          recent_commits = sum(
              len(event.get("payload", {}).get("commits", []))
              for event in events
              if event.get("type") == "PushEvent"
          )
          languages = Counter(
              repo.get("language") for repo in repos
              if repo.get("language") and not repo.get("fork")
          )
          top_language = languages.most_common(1)[0][0] if languages else "—"

          today = datetime.now(timezone.utc).date()
          start = today - timedelta(days=30)
          activity = {
              (start + timedelta(days=offset)).isoformat(): 0
              for offset in range(31)
          }
          for event in events:
              created = event.get("created_at")
              if not created:
                  continue
              event_day = datetime.fromisoformat(created.replace("Z", "+00:00")).date()
              key = event_day.isoformat()
              if key not in activity:
                  continue
              if event.get("type") == "PushEvent":
                  activity[key] += max(1, len(event.get("payload", {}).get("commits", [])))
              else:
                  activity[key] += 1

          metrics = {
              "public_repositories": user.get("public_repos"),
              "followers": user.get("followers"),
              "stars_received": sum(repo.get("stargazers_count", 0) for repo in repos if not repo.get("fork")),
              "forks_received": sum(repo.get("forks_count", 0) for repo in repos if not repo.get("fork")),
              "recent_commits": recent_commits,
              "top_language": top_language,
              "activity": activity,
          }
          Path("/tmp/github-live.json").write_text(json.dumps(metrics), encoding="utf-8")
          PY

      - name: run profile tests
        run: python -m unittest discover -s tests -v

      - name: render telemetry and activity
        run: |
          python scripts/generate_profile.py --theme dark --github-json /tmp/github-live.json --output assets/telemetry-dark.svg
          python scripts/generate_profile.py --theme light --github-json /tmp/github-live.json --output assets/telemetry-light.svg
          python scripts/generate_profile.py --kind activity --theme dark --github-json /tmp/github-live.json --output assets/activity-dark-v2.svg
          python scripts/generate_profile.py --kind activity --theme light --github-json /tmp/github-live.json --output assets/activity-light-v2.svg

      - name: commit telemetry when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry-dark.svg assets/telemetry-light.svg assets/activity-dark-v2.svg assets/activity-light-v2.svg
          if git diff --quiet --cached; then
            echo "telemetry unchanged"
          else
            git commit -m "chore: refresh profile telemetry"
            git push
          fi
